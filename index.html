<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>את״ל בני ברק</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="את״ל">
  <meta name="theme-color" content="#1a237e">
</head>
<body>

  <!-- מסך כניסה -->
  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">🛡️</div>
      <h1>את״ל בני ברק</h1>
      <p>מחלקת לוגיסטיקה</p>
      <input type="password" id="password-input" placeholder="הכנס סיסמה" />
      <button onclick="checkPassword()">כניסה</button>
      <p id="error-msg"></p>
    </div>
  </div>

  <!-- האפליקציה הראשית -->
  <div id="app" style="display:none">
    <header class="header">
      <div class="header-top">
        <button class="logout-btn" onclick="logout()">יציאה</button>
      </div>
      <div class="header-content">
        <div class="logo-circle">🛡️</div>
        <h1 class="title">את״ל בני ברק</h1>
        <p class="subtitle">מחלקת לוגיסטיקה</p>
      </div>
    </header>

    <main class="grid">
      <a href="vehicles.html" class="card blue">
        <span class="icon">🚗</span>
        <span class="label">רכב</span>
      </a>
      <a href="equipment.html" class="card dark">
        <span class="icon">📦</span>
        <span class="label">ציוד ומחסנים</span>
      </a>
      <a href="tasks.html" class="card green">
        <span class="icon">✅</span>
        <span class="label">משימות</span>
      </a>
      <a href="orders.html" class="card orange">
        <span class="icon">🛒</span>
        <span class="label">הזמנות</span>
      </a>
      <a href="requests.html" class="card teal">
        <span class="icon">📩</span>
        <span class="label">פניות שוטרים</span>
      </a>
      <a href="general.html" class="card gray">
        <span class="icon">ℹ️</span>
        <span class="label">כללי</span>
      </a>
    </main>
  </div>

  <script src="config.js"></script>
  <script>
    const PASSWORD = "atal2024";

    function checkPassword() {
      const input = document.getElementById('password-input').value;
      if (input === PASSWORD) {
        sessionStorage.setItem('auth', 'true');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } else {
        document.getElementById('error-msg').textContent = 'סיסמה שגויה, נסה שנית';
      }
    }

    function logout() {
      sessionStorage.removeItem('auth');
      location.reload();
    }

    if (sessionStorage.getItem('auth') === 'true') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('password-input')
        .addEventListener('keypress', function(e) {
          if (e.key === 'Enter') checkPassword();
        });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/atal-logistics/sw.js');
    }
  </script>
</body>
</html>
