<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a237e">
  <title>את״ל בני ברק</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

      <p class="subtitle">מחלקת לוגיסטיקה</p>

    <main class="grid">
      <a href="vehicles.html" class="card blue">

      <a href="tasks.html" class="card green">
        <span class="icon">✅</span>

      <a href="orders.html" class="card orange">
        <span class="icon">🛒</span>

      </a>
      <a href="requests.html" class="card teal">
        <span class="icon">📩</span>
